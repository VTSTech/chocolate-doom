name: Continuous Integration

on:
  push:
    branches:
      - "master"
    tags:
      - "*"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux GCC
            os: ubuntu-latest
            compiler: gcc
            shell: bash

          - name: macOS Clang
            os: macos-latest
            compiler: clang
            shell: bash

          - name: macOS x86 Clang
            os: macos-15-intel
            compiler: clang
            shell: bash

          - name: MSYS2 UCRT64
            os: windows-latest
            compiler: gcc
            shell: 'msys2 {0}'
            msystem: ucrt64
            msys-env: mingw-w64-ucrt-x86_64
            artifacts: true
            pkg-path: pkg/win32/*.zip
            pkg-dir: pkg/win32

    steps:
      - name: Install pandoc
        if: runner.os == 'Windows'
        shell: cmd
        run: choco install pandoc

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libsdl2-net-dev \
            libpng-dev \
            libsamplerate0-dev \
            libfluidsynth-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            automake \
            sdl2 \
            sdl2_mixer \
            sdl2_net \
            libpng \
            libsamplerate \
            fluid-synth

      - name: Install dependencies (MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          update: true
          path-type: inherit
          install: >-
            autotools
            zip
            ${{ matrix.config.msys-env }}-python-pip
            ${{ matrix.config.msys-env }}-gcc
            ${{ matrix.config.msys-env }}-SDL2
            ${{ matrix.config.msys-env }}-SDL2_mixer
            ${{ matrix.config.msys-env }}-SDL2_net
            ${{ matrix.config.msys-env }}-libpng
            ${{ matrix.config.msys-env }}-libsamplerate
            ${{ matrix.config.msys-env }}-fluidsynth

      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Configure
        env:
          CC: ${{ matrix.config.compiler }}
        run: |
          ./autogen.sh

      - name: Build
        run: make -j4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test
        run: |
          pip install pyyaml
          PREFIX=`sed -n '/PROGRAM_PREFIX/p' ${PWD}/config.h | cut -d '"' -f 2`
          make -j4 -C quickcheck check SOURCE_PORT=$PWD/src/${PREFIX}doom

      - name: Package
        if: ${{ matrix.config.artifacts }}
        run: |
          cd ${{ matrix.config.pkg-dir }}
          make

      # Stamp every zip with the commit it was built from: a BUILD-INFO.txt
      # goes inside each zip, and branch/PR builds append the short hash to
      # the zip filenames too, so two runs of the same version can be told
      # apart. Tag builds keep the canonical <game>-<version>-<arch>.zip
      # names for the GitHub Release; their BUILD-INFO.txt still records
      # the exact commit.
      - name: Stamp commit hash into packages
        if: ${{ matrix.config.artifacts }}
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          PACKAGE_STRING=`sed -n '/PACKAGE_STRING/p' ${GITHUB_WORKSPACE}/config.h | cut -d '"' -f 2`
          cd ${{ matrix.config.pkg-dir }}
          cat > BUILD-INFO.txt <<EOF
          Chocolate Doom VK
          commit:  ${GITHUB_SHA}
          short:   ${SHORT_SHA}
          ref:     ${GITHUB_REF}
          event:   ${GITHUB_EVENT_NAME}
          version: ${PACKAGE_STRING}
          built:   `date -u '+%Y-%m-%d %H:%M:%S UTC'`
          run:     ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          for z in *.zip; do
            zip "$z" BUILD-INFO.txt
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              mv "$z" "${z%.zip}-${SHORT_SHA}.zip"
            fi
          done
          rm -f BUILD-INFO.txt

      - name: Upload artifacts
        if: ${{ matrix.config.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-${{ env.SHORT_SHA }}
          path: ${{ matrix.config.pkg-path }}

      - name: Extract Package String
        if: ${{ contains(github.ref, 'tags') }}
        run: |
          PACKAGE_STRING=`sed -n '/PACKAGE_STRING/p' ${PWD}/config.h | cut -d '"' -f 2`
          echo "PACKAGE_STRING=${PACKAGE_STRING}" >> $GITHUB_ENV

      - name: Release
        if: ${{ contains(github.ref, 'tags') && matrix.config.artifacts }}
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.PACKAGE_STRING }}
          bodyFile: CHANGELOG.md
          allowUpdates: true
          artifacts: ${{ matrix.config.pkg-path }}
