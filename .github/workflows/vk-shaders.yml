name: VK shaders (libslang-vk)

# Chocolate Doom VK — build + smoke-test the libslang-vk integration.
#
# - Linux: full build with ENABLE_VK_SHADERS=ON, then a real game run on
#   lavapipe (software Vulkan) under Xvfb: freedoom + demo preset through
#   the preset chain, frame capture via -vkcapture, plus a compile check of
#   the ENABLE_VK_SHADERS=OFF fallback. Upstream's main.yml (autotools,
#   classic renderer) is left untouched.
# - Windows MSYS2 (UCRT64, MinGW): CMake build, artifacts packaged.
# - Windows MSVC (vcpkg manifest): CMake build.

on:
  push:
    branches:
      - "master"
      - "vk-shaders"
    paths-ignore:
      - "**.md"
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  linux:
    name: Linux GCC (lavapipe smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libsdl2-dev libsdl2-mixer-dev libpng-dev \
            mesa-vulkan-drivers vulkan-tools \
            xvfb freedoom

      - name: Configure (VK ON)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF

      - name: Build (VK ON)
        run: cmake --build build

      - name: Smoke test (Xvfb + lavapipe + freedoom)
        run: |
          set -e
          # Stage the demo preset from the fetched libslang-vk source tree.
          mkdir -p smoke/shaders
          cp build/_deps/libslang-vk-src/examples/presets/demo-bright.slangp smoke/
          cp build/_deps/libslang-vk-src/examples/presets/shaders/demo_bright.slang \
             build/_deps/libslang-vk-src/examples/presets/shaders/demo_downsample.slang \
             build/_deps/libslang-vk-src/examples/presets/shaders/demo_glow_combine.slang \
             smoke/shaders/
          cd smoke
          xvfb-run -a -s "-screen 0 1024x768x24" \
            stdbuf -oL -eL timeout -s KILL 90 \
            ../build/src/chocolate-doom \
              -iwad /usr/share/games/doom/freedoom1.wad \
              -shader demo-bright.slangp \
              -timedemo demo1 -window -2 -nosound -nomusic \
              -vkcapture 240 > smoke.log 2>&1 || true
          echo "--- key lines ---"
          grep -E "I_VK|timed" smoke.log || { echo "MISSING I_VK LINES"; cat smoke.log; exit 1; }
          grep -q "libslang-vk active" smoke.log
          grep -q "captured frame" smoke.log
          grep -q "timed" smoke.log
          grep -qE "Validation|VUID" smoke.log && { echo "VALIDATION MESSAGES FOUND"; exit 1; } || true
          test -s vkframe.tga
          echo "SMOKE OK: $(file vkframe.tga)"

      - name: Configure + build (VK OFF fallback)
        run: |
          cmake -S . -B build-novk -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF \
            -DENABLE_VK_SHADERS=OFF
          cmake --build build-novk

  windows-msys2:
    name: Windows MSYS2 (UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-libpng
            zip

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SDL2_NET=OFF \
            -DCMAKE_INSTALL_PREFIX=/ucrt64
          cmake --build build

      - name: Package
        run: |
          mkdir -p pkg
          cp build/src/chocolate-{doom,heretic,hexen,strife,setup}.exe pkg/
          # The MinGW runtime DLLs the binaries need on clean systems.
          ldd build/src/chocolate-doom.exe | grep ucrt64 | cut -d' ' -f3 | xargs -I{} cp {} pkg/ || true
          cd pkg && zip -q ../chocolate-doom-vk-windows-ucrt64.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-vk-windows-ucrt64
          path: chocolate-doom-vk-windows-ucrt64.zip

  windows-msvc:
    name: Windows MSVC (vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Restore vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: false

      - name: Install dependencies (vcpkg manifest)
        run: vcpkg install --triplet x64-windows

      - name: Configure + build
        run: |
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DENABLE_SDL2_NET=OFF ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: chocolate-doom-vk-windows-msvc
          path: |
            build/src/chocolate-doom.exe
            build/src/chocolate-heretic.exe
            build/src/chocolate-hexen.exe
            build/src/chocolate-strife.exe
            build/src/chocolate-setup.exe
